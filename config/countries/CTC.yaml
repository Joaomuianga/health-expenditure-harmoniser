# Country C - nested JSON (IFMIS), multi-currency, optional sub-transactions
country_code: CTC
source:
  file: country_c_expenditure.json
  format: json
  records_path: transactions
  metadata_path: metadata
  record_count_field: recordCount
  splits_field: subTransactions
fields:
  source_txn_id: transactionId
  txn_date: postingDate
  ministry_code: ministryCode
  ministry_name: ministryName
  account_code: coaCode
  description: description
  supplier: supplier
  amount: amount
currency:
  column: currency            # currency is per record (RWF / USD)
date_formats: ["%Y-%m-%d"]
expected_period: ["2023-07-01", "2024-06-30"]
health_ministry_codes: ["MINISANTE"]
